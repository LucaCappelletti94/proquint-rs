[package]
name = "proquint"
version = "0.1.0"
edition = "2024"
authors = ["Christian Blades <christian.blades+github@gmail.com>"]
repository = "https://github.com/christian-blades-cb/proquint-rs"
documentation = "https://docs.rs/proquint"
keywords = ["proquint", "usability", "humanize"]
categories = ["encoding", "value-formatting"]
license = "BSD-3-Clause"
description = "Proquints are readable, pronounceable representations of identifiers. For humans."
readme = "README.md"

[dependencies]
uuid = { version = "1.16.0", optional = true }

[dev-dependencies]
quickcheck = "0.6.1"

[features]
default = ["uuid"]
uuid = ["dep:uuid"]
